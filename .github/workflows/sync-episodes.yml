name: Sync episodes from YouTube

# Why this exists: sync.py scrapes the YouTube channel page for an
# INNERTUBE_API_KEY. That works from a laptop and fails on Vercel, because
# YouTube serves datacenter IPs a different page. build.py catches the error
# and carries on, so the deploy goes green while episodes.js quietly stays at
# whatever was last committed. The site sat three weeks stale that way, and
# nothing anywhere said so.
#
# GitHub runners are a different network, so the scrape may succeed here. If it
# does, this commits the refreshed file and that push triggers the normal Vercel
# deploy. If it does not, the job FAILS loudly and you get an email, which is the
# whole point: a stale site should never look healthy.

on:
  schedule:
    - cron: '30 2 * * *'      # 08:00 IST, after the usual upload hour
  workflow_dispatch:           # and runnable by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: sync-episodes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Note what we had before
        run: cp episodes.js /tmp/episodes.before.js

      - name: Run the YouTube sync
        id: sync
        run: |
          set -o pipefail
          python3 sync.py 2>&1 | tee /tmp/sync.log

      # sync.py stamps a fresh "Last synced" time on every run, so the file
      # always differs even when nothing was published. Comparing bytes would
      # commit noise daily. Compare the episode list itself.
      - name: Did the episodes actually change?
        id: diff
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          def eps(path):
              s = open(path).read()
              i = s.index('window.EPISODES = [') + len('window.EPISODES = ')
              return json.JSONDecoder().raw_decode(s[i:])[0]
          before, after = eps('/tmp/episodes.before.js'), eps('episodes.js')
          key = lambda e: (e.get('id'), e.get('n'), e.get('title'), e.get('guest'), e.get('cat'))
          changed = [key(e) for e in before] != [key(e) for e in after]
          print(f'changed={"yes" if changed else "no"}')
          print(f'count={len(after)}')
          new_ids = {e['id'] for e in after} - {e['id'] for e in before}
          print(f'new={len(new_ids)}')
          PY
          cat "$GITHUB_OUTPUT"

      - name: Commit only if something actually changed
        run: |
          if [ "${{ steps.diff.outputs.changed }}" != "yes" ]; then
            echo "Episode list is identical. Only the timestamp moved, so nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episodes.js content/episodes content/guests.json 2>/dev/null || git add episodes.js
          git commit -m "Sync episodes from YouTube (${{ steps.diff.outputs.count }} total, ${{ steps.diff.outputs.new }} new)

          Automated. Pushing this triggers the Vercel deploy that serves it.

          Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>"
          git push
          echo "Pushed. Vercel will redeploy."
